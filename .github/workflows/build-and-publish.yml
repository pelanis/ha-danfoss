name: Build and Publish Addon

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR with Maven
        run: |
          cd danfoss-addon
          mvn clean package -DskipTests
          ls -lh target/
          cp target/ha-danfoss-addon-0.0.1.jar .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./danfoss-addon
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ha-danfoss:latest
            ${{ secrets.DOCKER_USERNAME }}/ha-danfoss:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release notes
        if: steps.version.outputs.is_release == 'true'
        run: |
          echo "## Danfoss Icon Addon ${{ steps.version.outputs.version }}" > release-notes.md
          echo "" >> release-notes.md
          echo "Docker image: \`${{ secrets.DOCKER_USERNAME }}/ha-danfoss:${{ steps.version.outputs.version }}\`" >> release-notes.md
          echo "" >> release-notes.md
          echo "### Installation" >> release-notes.md
          echo "See [docs/BUILD.md](docs/BUILD.md) for installation instructions." >> release-notes.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ha-danfoss-addon
          path: |
            danfoss-addon/target/*.jar
            danfoss-addon/config.yaml
          retention-days: 30
